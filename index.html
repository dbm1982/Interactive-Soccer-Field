<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Goal Angle Simulator</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1726;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #app {
      margin-top: 20px;
      max-width: 900px;
      width: 100%;
    }
    .field-wrapper {
      background: #0b5c2c;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    svg {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #0b5c2c;
    }
    .goal-line {
      stroke: #ffffff;
      stroke-width: 4;
    }
    .box-line {
      stroke: rgba(255,255,255,0.4);
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
    .triangle-line {
      stroke: #ffcc00;
      stroke-width: 3;
    }
    .post {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1;
    }
    .shooter {
      fill: #ff4444;
      stroke: #ffffff;
      stroke-width: 2;
      cursor: grab;
    }
    .shooter.dragging {
      cursor: grabbing;
    }
    .label {
      fill: #ffffff;
      font-size: 12px;
      pointer-events: none;
    }
    .hud {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }
    .hud-card {
      background: #111827;
      border-radius: 6px;
      padding: 10px 12px;
      border: 1px solid #1f2937;
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 18px;
      font-weight: 600;
      color: #f9fafb;
    }
    .hud-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="field-wrapper">
      <svg id="field" viewBox="0 0 800 500">
        <rect x="40" y="40" width="720" height="420" fill="none" stroke="#ffffff" stroke-width="2" />

        <line id="goal-line" class="goal-line" x1="300" y1="440" x2="500" y2="440" />

        <rect x="320" y="380" width="160" height="60" class="box-line" />
        <rect x="260" y="300" width="280" height="140" class="box-line" />

        <line id="line-AC" class="triangle-line" />
        <line id="line-BC" class="triangle-line" />
        <line id="line-AB" class="triangle-line" />

        <circle id="post-A" class="post" cx="300" cy="440" r="6" />
        <circle id="post-B" class="post" cx="500" cy="440" r="6" />

        <circle id="shooter" class="shooter" cx="400" cy="220" r="9" />

        <text id="label-A" class="label" x="290" y="430">A (Left Post)</text>
        <text id="label-B" class="label" x="490" y="430">B (Right Post)</text>
        <text id="label-C" class="label" x="410" y="210">Shooter (C)</text>
      </svg>
    </div>

    <div class="hud">
      <div class="hud-card">
        <div class="hud-title">Goal width (AB)</div>
        <div id="hud-ab" class="hud-value">–</div>
        <div class="hud-sub">Distance between posts</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Distance to left post (AC)</div>
        <div id="hud-ac" class="hud-value">–</div>
        <div class="hud-sub">Shooter → left post</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Distance to right post (BC)</div>
        <div id="hud-bc" class="hud-value">–</div>
        <div class="hud-sub">Shooter → right post</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Shooting angle at C</div>
        <div id="hud-angle" class="hud-value">–°</div>
        <div class="hud-sub">Angle between lines to each post</div>
      </div>
    </div>
  </div>

  <script>
    const PX_PER_FOOT = 200 / 24;
    const FEET = px => px / PX_PER_FOOT;

    function distance(p1, p2) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function angleAtC(a, b, c) {
      if (a === 0 || b === 0) return 0;
      const cosC = (a*a + b*b - c*c) / (2*a*b);
      const clamped = Math.max(-1, Math.min(1, cosC));
      return Math.acos(clamped) * 180 / Math.PI;
    }

    (function init() {
      const svg = document.getElementById("field");
      const shooter = document.getElementById("shooter");

      const lineAC = document.getElementById("line-AC");
      const lineBC = document.getElementById("line-BC");
      const lineAB = document.getElementById("line-AB");

      const hudAB = document.getElementById("hud-ab");
      const hudAC = document.getElementById("hud-ac");
      const hudBC = document.getElementById("hud-bc");
      const hudAngle = document.getElementById("hud-angle");

      const postA = { x: 300, y: 440 };
      const postB = { x: 500, y: 440 };

      const labelAB = document.createElementNS("http://www.w3.org/2000/svg", "text");
      const labelAC = document.createElementNS("http://www.w3.org/2000/svg", "text");
      const labelBC = document.createElementNS("http://www.w3.org/2000/svg", "text");

      [labelAB, labelAC, labelBC].forEach(l => {
        l.setAttribute("class", "label");
        l.setAttribute("font-size", "14");
        svg.appendChild(l);
      });

      let shooterPos = { x: 400, y: 220 };
      let dragging = false;

      function updateGeometry() {
        lineAC.setAttribute("x1", postA.x);
        lineAC.setAttribute("y1", postA.y);
        lineAC.setAttribute("x2", shooterPos.x);
        lineAC.setAttribute("y2", shooterPos.y);

        lineBC.setAttribute("x1", postB.x);
        lineBC.setAttribute("y1", postB.y);
        lineBC.setAttribute("x2", shooterPos.x);
        lineBC.setAttribute("y2", shooterPos.y);

        lineAB.setAttribute("x1", postA.x);
        lineAB.setAttribute("y1", postA.y);
        lineAB.setAttribute("x2", postB.x);
        lineAB.setAttribute("y2", postB.y);

        const AB_px = distance(postA, postB);
        const AC_px = distance(postA, shooterPos);
        const BC_px = distance(postB, shooterPos);

        const AB = FEET(AB_px);
        const AC = FEET(AC_px);
        const BC = FEET(BC_px);

        const angleC = angleAtC(BC_px, AC_px, AB_px);

        hudAB.textContent = AB.toFixed(1) + " ft";
        hudAC.textContent = AC.toFixed(1) + " ft";
        hudBC.textContent = BC.toFixed(1) + " ft";
        hudAngle.textContent = angleC.toFixed(1) + "°";

        labelAB.setAttribute("x", (postA.x + postB.x)/2);
        labelAB.setAttribute("y", postA.y - 10);
        labelAB.textContent = AB.toFixed(1) + " ft";

        labelAC.setAttribute("x", (postA.x + shooterPos.x)/2);
        labelAC.setAttribute("y", (postA.y + shooterPos.y)/2);
        labelAC.textContent = AC.toFixed(1) + " ft";

        labelBC.setAttribute("x", (postB.x + shooterPos.x)/2);
        labelBC.setAttribute("y", (postB.y + shooterPos.y)/2);
        labelBC.textContent = BC.toFixed(1) + " ft";
      }

      function setShooterPosition(x, y) {
        shooterPos.x = Math.max(60, Math.min(740, x));
        shooterPos.y = Math.max(60, Math.min(430, y));

        shooter.setAttribute("cx", shooterPos.x);
        shooter.setAttribute("cy", shooterPos.y);

        const labelC = document.getElementById("label-C");
        labelC.setAttribute("x", shooterPos.x + 10);
        labelC.setAttribute("y", shooterPos.y - 10);

        updateGeometry();
      }

      function getSVGPoint(evt) {
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX || evt.touches[0].clientX;
        pt.y = evt.clientY || evt.touches[0].clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
      }

      shooter.addEventListener("pointerdown", evt => {
        dragging = true;
        shooter.classList.add("dragging");
        const p = getSVGPoint(evt);
        setShooterPosition(p.x, p.y);
      });

      window.addEventListener("pointermove", evt => {
        if (!dragging) return;
        const p = getSVGPoint(evt);
        setShooterPosition(p.x, p.y);
      });

      window.addEventListener("pointerup", () => {
        dragging = false;
        shooter.classList.remove("dragging");
      });

      updateGeometry();
    })();
  </script>
</body>
</html>
